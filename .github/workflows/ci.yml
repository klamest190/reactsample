# Checks every push to main and every pull request.
#   code:    lint, type check + production build, Vitest (unit, dom, content) with coverage
#   browser: course contents on the production build, then every page (scripts/seiten-testen.mjs)
# The browser tests use the Google Chrome that GitHub's Ubuntu runners come with (playwright-core,
# no browser download).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Tests (Vitest) with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Kursinhalte (Produktions-Build)
        run: npm run test:inhalte -- --build
      - name: Alle Seiten
        run: npm run test:seiten
